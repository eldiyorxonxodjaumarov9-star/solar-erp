# Include inside the existing SolarERP HTTPS server block only.
# No change to other apps, upstreams, TLS certificates, or existing API routes.
location = /api/telegram/camera { return 308 /api/telegram/camera/; }
location ^~ /api/telegram/camera/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    client_max_body_size 11m;
    # The app emits Telegram-only CSP frame-ancestors for Web/Desktop embedding.
    proxy_hide_header X-Frame-Options;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
}
