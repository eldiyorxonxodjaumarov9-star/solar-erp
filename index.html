<!doctype html>
<html lang="uz">
  <head>
    <script>
      (function () {
        try {
          var k = "appTheme";
          var allowed = ["yashil", "yorug", "qorongi"];
          var v = localStorage.getItem(k);
          if (!allowed.includes(v)) v = "yashil";
          document.documentElement.setAttribute("data-app-theme", v);
        } catch (e) {
          document.documentElement.setAttribute("data-app-theme", "yashil");
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
